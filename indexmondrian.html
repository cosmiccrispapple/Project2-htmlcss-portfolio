<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */

    body{
      display: flex;
      justify-content: center;
      align-content: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }

    .container{
      height: 748px;
      width: 748px;
      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
      gap: 9px;
      background-color: white;
    }

    .lavender{
      background-color:rgb(150, 151, 255);
      
    }

    .minty{
      background-color: rgb(171, 240, 206);
      grid-column: span 3;
    }

    .seablue{
      background-color:blue;
      grid-row: span 2;
    }

    .lavender2{
      background-color:rgb(150, 151, 255);
      grid-area: 2 / 2 / 4 / 4;
    }

    .violet{
      background-color:rgb(134, 7, 253);
      border-bottom: 10px solid white;
    }

    .darkblue{
      background-color:darkblue;
      grid-row: span 2;
    }

    .seablue2{
      background-color:blue;
      
    }

    .minty2{
      background-color: rgb(171, 240, 206);
      
    }

    .violet2{
      background-color:rgb(134, 7, 253);
     
    }

  </style>
</head>

<body>
  <div class="container">
    <div class="lavender">

    </div>
    <div class="minty">

    </div>
    <div class="seablue">

    </div>
    <div class="lavender2">

    </div>
    <div class="violet">

    </div>
    <div class="darkblue">

    </div>
    <div clsas="seablue2">

    </div>
    <div class="minty2">

    </div>
    <div class="violet2">

    </div>
  </div>
</body>

</html>
